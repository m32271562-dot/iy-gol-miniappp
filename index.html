<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İY Gol Baskısı</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        .header {
            text-align: center;
            padding: 10px 0;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 15px;
        }
        .header h2 { margin: 0; color: #ff4757; font-size: 20px; }
        .match-card {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            border-left: 4px solid #ff4757;
        }
        .league { font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        .teams { font-size: 15px; font-weight: bold; margin-bottom: 8px; }
        .details { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; }
        .badge { background: #2ed573; color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h2>🚨 İY GOL BASKISI</h2>
    </div>
    <div id="match-container">
        <p style="text-align:center; color:#888;">Maçlar yükleniyor...</p>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        async function fetchMatches() {
            try {
                const response = await fetch('/api/matches');
                const result = await response.json();
                const container = document.getElementById('match-container');
                container.innerHTML = '';

                if (!result.data || result.data.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#888;">Şu an aktif maç bulunamadı.</p>';
                    return;
                }

                result.data.forEach(match => {
                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.innerHTML = `
                        <div class="league">${match.league}</div>
                        <div class="teams">${match.home} vs ${match.away}</div>
                        <div class="details">
                            <span>Saat: ${match.time}</span>
                            <span class="badge">${match.prediction}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                document.getElementById('match-container').innerHTML = '<p style="text-align:center; color:#ff4757;">Veri çekilemedi.</p>';
            }
        }

        fetchMatches();
    </script>
</body>
</html>
