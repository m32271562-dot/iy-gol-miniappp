<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet Sinyal Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 12px; }
        .tabs { display: flex; margin-bottom: 15px; border-bottom: 2px solid #2a2a2a; }
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; color: #888; font-weight: bold; font-size: 14px; cursor: pointer; }
        .tab-btn.active { color: #2ed573; border-bottom: 3px solid #2ed573; }
        .card { background-color: #1e1e1e; border-radius: 8px; padding: 12px; margin-bottom: 10px; border-left: 4px solid #2ed573; }
        .card.pre-card { border-left-color: #eccc68; }
        .league { font-size: 10px; color: #888; text-transform: uppercase; }
        .teams { font-size: 14px; font-weight: bold; margin: 6px 0; }
        .info { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; align-items: center; }
        .badge { background: #2ed573; color: #000; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-pre { background: #eccc68; color: #000; }
    </style>
</head>
<body>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('live')">⚡ Canlı Maçlar</button>
        <button class="tab-btn" onclick="switchTab('pre')">📅 Maç Önü</button>
    </div>

    <div id="content-container">Yükleniyor...</div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        let currentTab = 'live';
        let matchData = { live: [], pre: [] };

        async function loadData() {
            try {
                const res = await fetch('/api/matches');
                const data = await res.json();
                matchData = data;
                render();
            } catch(e) {
                document.getElementById('content-container').innerHTML = '<p style="text-align:center; color:#ff4757;">Veri yüklenemedi.</p>';
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(tab === 'live') document.querySelectorAll('.tab-btn')[0].classList.add('active');
            else document.querySelectorAll('.tab-btn')[1].classList.add('active');
            render();
        }

        function render() {
            const container = document.getElementById('content-container');
            container.innerHTML = '';
            const items = currentTab === 'live' ? matchData.live : matchData.pre;

            if(!items || items.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#777;">Şu an bu kategoride sinyal bulunamadı.</p>`;
                return;
            }

            items.forEach(m => {
                const div = document.createElement('div');
                div.className = `card ${currentTab === 'pre' ? 'pre-card' : ''}`;
                div.innerHTML = `
                    <div class="league">${m.league}</div>
                    <div class="teams">${m.home} vs ${m.away}</div>
                    <div class="info">
                        <span>${m.status_text}</span>
                        <span class="badge ${currentTab === 'pre' ? 'badge-pre' : ''}">${m.prediction}</span>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
</html>
